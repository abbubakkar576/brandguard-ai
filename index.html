          </div>

          <div className="flex items-center gap-2">
            {history.length > 0 && (
              <button
                type="button"
                onClick={() => {
                  if (window.confirm('Are you sure you want to clear all history records?')) {
                    onClearAll();
                    if (showToast) showToast('History archive cleared.', 'info');
                  }
                }}
                className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-colors"
              >
                Clear Archive
              </button>
            )}
          </div>
        </div>

        {/* Search & Filters */}
        <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
          <div className="sm:col-span-6 relative">
            <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              type="text"
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              placeholder="Search by title, phrase, or keyword..."
              className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            />
          </div>

          <div className="sm:col-span-3">
            <select
              value={statusFilter}

            >
              <option value="all">All Statuses</option>
              <option value="approved">Approved</option>
              <option value="pending_approval">Pending Approval</option>
              <option value="needs_revision">Needs Revision</option>
              <option value="draft">Draft</option>
            </select>
          </div>

                    setSelectedReport(null);
                    onOpenInChecker(reportToOpen);
                  }}
                  className="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md"
                >
                  Open in Checker
                </button>
                <button
                  type="button"
                  onClick={() => handleDownloadReport(selectedReport)}
                  className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                >
                  Download Markdown
                </button>
                <button
                  type="button"
                  onClick={() => setSelectedReport(null)}
                  className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  window.HistoryView = HistoryView;

})(window);

// BrandGuard AI - Settings & Gemini API Modal Component
(function(window) {
  'use strict';

  const SettingsModal = ({
    isOpen,
    onClose,
    settings,
    onSaveSettings,
    onResetAllData,
    showToast
  }) => {
    if (!isOpen) return null;

    const [apiKey, setApiKey] = React.useState(settings.apiKey || '');
    const [model, setModel] = React.useState(settings.model || 'gemini-1.5-flash');
    const [authorName, setAuthorName] = React.useState(settings.authorName || 'Alex Rivera (Staff Content Strategist)');
    const [reviewerName, setReviewerName] = React.useState(settings.reviewerName || 'Jane Doe (Head of Brand & Legal)');
    const [isTesting, setIsTesting] = React.useState(false);
    const [testResult, setTestResult] = React.useState(null);
    const [showKey, setShowKey] = React.useState(false);

    // Test Gemini API Key
    const handleTestKey = async () => {
      if (!apiKey.trim()) {
        setTestResult({ success: false, message: 'Please enter a Gemini API key first.' });
        return;
      }

      setIsTesting(true);
      setTestResult(null);

      try {
        const res = await window.GeminiService.testApiKey(apiKey, model);
        setTestResult(res);
      } catch (e) {
        setTestResult({ success: false, message: e.message });
      } finally {
        setIsTesting(false);
      }
    };

    // Save Settings
    const handleSave = (e) => {
      e.preventDefault();
      const updated = {
        apiKey: apiKey.trim(),
        model: model,
        authorName: authorName.trim(),
        reviewerName: reviewerName.trim()
      };

      onSaveSettings(updated);
      if (showToast) showToast('Settings saved successfully.', 'success');
      onClose();
    };

    return (
      <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-6">
          {/* Header */}
          <div className="flex items-center justify-between pb-3 border-b border-slate-800">
            <div className="flex items-center gap-2.5">
              <div className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                </svg>
              </div>
              <div>
                <h3 className="text-base font-bold text-white">BrandGuard Settings</h3>
                <p className="text-xs text-slate-400">Configure AI engine & governance credentials</p>
              </div>
            </div>

            <button
              type="button"
              onClick={onClose}
              className="text-slate-400 hover:text-white p-1"
            >
              ✕
            </button>
          </div>

          <form onSubmit={handleSave} className="space-y-4 text-xs">
            {/* Gemini API Key */}
            <div className="space-y-1.5">
              <div className="flex items-center justify-between">
                <label className="text-slate-300 font-semibold">Gemini API Key:</label>
                <button
                  type="button"
                  onClick={() => setShowKey(!showKey)}
                  className="text-[11px] text-indigo-400 hover:text-indigo-300"
                >
                  {showKey ? 'Hide Key' : 'Show Key'}
                </button>
              </div>

              <div className="relative">
                <input
                  type={showKey ? 'text' : 'password'}
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                  placeholder="AIzaSy... (leave empty to use local rule engine)"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none"
                />
              </div>

              <p className="text-[11px] text-slate-400 leading-relaxed">
                If provided, BrandGuard AI uses Google Gemini to evaluate complex semantic tone and fact verification. If left blank, the app operates 100% offline using our built-in deterministic heuristic rule engine.
              </p>

              {/* Test Button */}
              <div className="pt-1">
                <button
                  type="button"
                  onClick={handleTestKey}
                  disabled={isTesting || !apiKey.trim()}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors disabled:opacity-50"
                >
                  {isTesting ? 'Testing Connectivity...' : 'Test Gemini Connection'}
                </button>
              </div>

              {/* Test Result Message */}
              {testResult && (
                <div className={`p-2.5 rounded-lg text-xs mt-2 ${
                  testResult.success
                    ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30'
                    : 'bg-rose-500/10 text-rose-300 border border-rose-500/30'
                }`}>
                  {testResult.message}
                </div>
              )}
            </div>

            {/* Model Selection */}
            <div className="space-y-1.5">
              <label className="text-slate-300 font-semibold block">Gemini AI Model:</label>
              <select
                value={model}
                onChange={e => setModel(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:ring-1 focus:ring-indigo-500 focus:outline-none"
              >
                <option value="gemini-1.5-flash">gemini-1.5-flash (Recommended: Low latency & high accuracy)</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro (Deep reasoning for nuanced guidelines)</option>
                <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp (Experimental next-gen)</option>
              </select>
            </div>

            {/* Personas / Signatures */}
            <div className="pt-2 border-t border-slate-800 space-y-3">
              <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Governance Team Identities</h4>

              <div>
                <label className="text-slate-300 font-semibold block mb-1">Author Identity:</label>
                <input
                  type="text"
                  value={authorName}
                  onChange={e => setAuthorName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                />
              </div>

              <div>
                <label className="text-slate-300 font-semibold block mb-1">Reviewer / Compliance Officer Identity:</label>
                <input
                  type="text"
                  value={reviewerName}
                  onChange={e => setReviewerName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                />
              </div>
            </div>

            {/* Reset App Data */}
            <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
              <div>
                <div className="font-semibold text-slate-300">Restore Demo Environment</div>
                <div className="text-[11px] text-slate-400">Resets guidelines & history to factory defaults</div>
              </div>
              <button
                type="button"
                onClick={() => {
                  if (window.confirm('Reset all demo history and brand rules to initial baseline?')) {
                    onResetAllData();
                    onClose();
                  }
                }}
                className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-colors"
              >
                Reset Demo Data
              </button>
            </div>

            {/* Save Buttons */}
            <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-800">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/20"
              >
                Save Settings
              </button>
            </div>
          </form>
        </div>
      </div>
    );
  };

  window.SettingsModal = SettingsModal;

})(window);

// BrandGuard AI - Main React Application Root
(function(window) {
  'use strict';

  const App = () => {
    // Navigation & View state
    const [activeTab, setActiveTab] = React.useState('dashboard');
    const [activeRole, setActiveRole] = React.useState('author');
    const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
    const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

    // Persistent state
    const [guidelines, setGuidelines] = React.useState(() => window.StorageService.getGuidelines());
    const [history, setHistory] = React.useState(() => window.StorageService.getHistory());
    const [settings, setSettings] = React.useState(() => window.StorageService.getSettings());

    // Draft to load in ContentChecker
    const [draftToLoad, setDraftToLoad] = React.useState(null);

    // Notification toast state
    const [toasts, setToasts] = React.useState([]);

    const showToast = (message, type = 'info', options = {}) => {
      const id = `toast-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`;
      const newToast = { id, message, type, ...options };

      setToasts(prev => [newToast, ...prev.slice(0, 4)]);

      // Auto dismiss after 4 seconds
      setTimeout(() => {
        setToasts(prev => prev.filter(t => t.id !== id));
      }, 4200);
    };

    const removeToast = (id) => {
      setToasts(prev => prev.filter(t => t.id !== id));
    };

    // Guidelines handlers
    const handleSaveGuidelines = (updated) => {
      window.StorageService.saveGuidelines(updated);
      setGuidelines(updated);
    };

    const handleResetGuidelines = () => {
      const reset = window.StorageService.resetGuidelines();
      setGuidelines(reset);
    };

    // History handlers
    const handleSaveRecord = (record) => {
      const saved = window.StorageService.saveCheckRecord(record);
      setHistory(window.StorageService.getHistory());
      return saved;
    };

    const handleDeleteRecord = (id) => {
      window.StorageService.deleteCheckRecord(id);
      setHistory(window.StorageService.getHistory());
    };

    const handleClearAllHistory = () => {
      window.StorageService.clearAllHistory();
      setHistory([]);
    };

    // Settings handlers
    const handleSaveSettings = (updated) => {
      const saved = window.StorageService.saveSettings(updated);
      setSettings(saved);
    };

    const handleResetAllData = () => {
      handleResetGuidelines();
      const initialHistory = window.StorageService.getInitialHistorySeed();
      window.StorageService.saveAllHistory(initialHistory);
      setHistory(initialHistory);
      showToast('Restored all demo data and corporate guidelines.', 'success');
    };

    // Navigate to checker with optional preset
    const handleNavigateToCheckerWithPreset = (presetId) => {
      if (presetId && window.BrandGuardDemos) {
        const found = window.BrandGuardDemos.samples.find(s => s.id === presetId);
        if (found) {
          setDraftToLoad({
            title: found.title,
            contentType: found.type,
            content: found.content,
            status: 'draft'
          });
        }
      }
      setActiveTab('checker');
    };

    // Open existing record from dashboard or history
    const handleOpenRecordInChecker = (record) => {
      setDraftToLoad(record);
      setActiveTab('checker');
      showToast(`Loaded "${record.title}" into Content Checker.`, 'info');
    };

    // Pending review count for badge
    const pendingReviewCount = history.filter(h => h.status === 'pending_approval').length;

    return (
      <div className="min-h-screen bg-[#0A0F1D] text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white">
        {/* Top Navbar */}
        <window.Navbar
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          activeRole={activeRole}
          onToggleRole={role => {
            setActiveRole(role);
            showToast(`Switched persona to: ${role === 'author' ? 'Content Author' : 'Compliance Reviewer'}`, 'info');
          }}
          settings={settings}
          onOpenSettings={() => setIsSettingsOpen(true)}
          onNewCheck={() => {
            setDraftToLoad({
              title: 'Untitled Content Draft',
              contentType: 'social',
              content: '',
              status: 'draft'
            });
            setActiveTab('checker');
          }}
        />

        {/* Mobile Navigation Bar */}
        <div className="md:hidden flex items-center justify-between px-4 py-2 bg-slate-950 border-b border-slate-800 text-xs">
          <div className="flex items-center gap-1 overflow-x-auto py-1">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`px-3 py-1.5 rounded-lg font-semibold ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
            >
              Dashboard
            </button>
            <button
              onClick={() => setActiveTab('checker')}
              className={`px-3 py-1.5 rounded-lg font-semibold ${activeTab === 'checker' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
            >
              Checker
            </button>
            <button
              onClick={() => setActiveTab('guidelines')}
              className={`px-3 py-1.5 rounded-lg font-semibold ${activeTab === 'guidelines' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
            >
              Guidelines
            </button>
            <button
              onClick={() => setActiveTab('review')}
              className={`px-3 py-1.5 rounded-lg font-semibold ${activeTab === 'review' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
            >
              Review ({pendingReviewCount})
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`px-3 py-1.5 rounded-lg font-semibold ${activeTab === 'history' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
            >
              History
            </button>
          </div>
        </div>

        {/* Main Body Layout */}
        <div className="flex-1 flex max-w-[1600px] w-full mx-auto">
          {/* Desktop Sidebar */}
          <window.Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            pendingCount={pendingReviewCount}
            activeRole={activeRole}
            settings={settings}
          />

          {/* Main Content Viewport */}
          <main className="flex-1 p-4 sm:p-6 lg:p-8 min-w-0">
            {activeTab === 'dashboard' && (
              <window.DashboardView
                history={history}
                guidelines={guidelines}
                onNavigateToChecker={handleNavigateToCheckerWithPreset}
                onNavigateToGuidelines={() => setActiveTab('guidelines')}
                onNavigateToReview={() => setActiveTab('review')}
                onOpenCheckRecord={handleOpenRecordInChecker}
              />
            )}

            {activeTab === 'checker' && (
              <window.ContentChecker
                key={draftToLoad ? draftToLoad.id || draftToLoad.title : 'default-checker'}
                guidelines={guidelines}
                activeRole={activeRole}
                settings={settings}
                initialContent={draftToLoad}
                onSaveToHistory={handleSaveRecord}
                showToast={showToast}
              />
            )}

            {activeTab === 'guidelines' && (
              <window.GuidelinesView
                guidelines={guidelines}
                onSaveGuidelines={handleSaveGuidelines}
                onResetGuidelines={handleResetGuidelines}
                showToast={showToast}
              />
            )}

            {activeTab === 'review' && (
              <window.ReviewWorkflowView
                history={history}
                activeRole={activeRole}
                settings={settings}
                onUpdateRecord={handleSaveRecord}
                onOpenInChecker={handleOpenRecordInChecker}
                showToast={showToast}
              />
            )}

            {activeTab === 'history' && (
              <window.HistoryView
                history={history}
                onOpenInChecker={handleOpenRecordInChecker}
                onDeleteRecord={handleDeleteRecord}
                onClearAll={handleClearAllHistory}
                showToast={showToast}
              />
            )}
          </main>
        </div>

        {/* Settings Modal */}
        <window.SettingsModal
          isOpen={isSettingsOpen}
          onClose={() => setIsSettingsOpen(false)}
          settings={settings}
          onSaveSettings={handleSaveSettings}
          onResetAllData={handleResetAllData}
          showToast={showToast}
        />

        {/* Global Toast Notification System */}
        <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
          {toasts.map(toast => {
            let toastBg = 'bg-slate-900 border-indigo-500/40 text-slate-200';
            let iconSvg = (
              <svg className="w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            );

            if (toast.type === 'success') {
              toastBg = 'bg-slate-900 border-emerald-500/50 text-emerald-200';
              iconSvg = (
                <svg className="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                </svg>
              );
            } else if (toast.type === 'warning') {
              toastBg = 'bg-slate-900 border-amber-500/50 text-amber-200';
              iconSvg = (
                <svg className="w-4 h-4 text-amber-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              );
            } else if (toast.type === 'error') {
              toastBg = 'bg-slate-900 border-rose-500/50 text-rose-200';
              iconSvg = (
                <svg className="w-4 h-4 text-rose-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              );
            }

            return (
              <div
                key={toast.id}
                className={`pointer-events-auto border rounded-xl p-3.5 shadow-2xl backdrop-blur-md flex items-center justify-between gap-3 text-xs animate-slideUp ${toastBg}`}
              >
                <div className="flex items-center gap-2.5">
                  {iconSvg}
                  <span className="font-medium">{toast.message}</span>
                </div>

                <div className="flex items-center gap-2 flex-shrink-0">
                  {toast.actionLabel && toast.onAction && (
                    <button
                      type="button"
                      onClick={() => {
                        toast.onAction();
                        removeToast(toast.id);
                      }}
                      className="px-2 py-0.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px]"
                    >
                      {toast.actionLabel}
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => removeToast(toast.id)}
                    className="text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // Mount Application
  const rootElement = document.getElementById('root');
  if (rootElement) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  }

  window.BrandGuardApp = App;

})(window);


  </script>
</body>
</html>
