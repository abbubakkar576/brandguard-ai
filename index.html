/* BrandGuard AI - Custom Styles */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --primary-navy: #0A0F1D;
  --surface-navy: #0F172A;
  --surface-card: #1E293B;
  --border-subtle: #334155;
  --brand-indigo: #6366F1;
  --brand-cyan: #06B6D4;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #0A0F1D;
  color: #F8FAFC;
  overflow-x: hidden;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #0F172A;
}

::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 9999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

/* Issue Highlights in Content Viewer */
.highlight-marker {
  padding: 2px 4px;
  border-radius: 4px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline;
}

.hl-critical {
  background-color: rgba(244, 63, 94, 0.25);
  border-bottom: 2px solid #F43F5E;
  color: #FECDD3;
}
.hl-critical:hover, .hl-critical.active {
  background-color: rgba(244, 63, 94, 0.45);
  box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
}

.hl-warning {
  background-color: rgba(245, 158, 11, 0.25);
  border-bottom: 2px solid #F59E0B;
  color: #FDE68A;
}
.hl-warning:hover, .hl-warning.active {
  background-color: rgba(245, 158, 11, 0.45);
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
}

.hl-suggestion {
  background-color: rgba(99, 102, 241, 0.25);
  border-bottom: 2px solid #6366F1;
  color: #C7D2FE;
}
.hl-suggestion:hover, .hl-suggestion.active {
  background-color: rgba(99, 102, 241, 0.45);
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
}

/* Pulse Glows */
@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
  }
  50% {
    box-shadow: 0 0 28px rgba(99, 102, 241, 0.6);
  }
}

.pulse-glow {
  animation: pulseGlow 3s infinite ease-in-out;
}

/* Glass Card */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(51, 65, 85, 0.6);
}

.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(51, 65, 85, 0.5);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.glass-card:hover {
  border-color: rgba(99, 102, 241, 0.5);
  transform: translateY(-1px);
}

/* Code & Monospace font */
.font-mono {
  font-family: 'JetBrains Mono', monospace;
}

/* Print styles for Compliance Report */
@media print {
  body {
    background-color: #ffffff !important;
    color: #000000 !important;
  }
  .no-print {
    display: none !important;
  }
  .print-only {
    display: block !important;
  }
}

  <!-- Startup Watchdog & Error Recovery Script -->
  <script>
    (function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('.animate-pulse')) {
          var recoveryBox = document.getElementById('loading-recovery-box');
          if (recoveryBox) {
            recoveryBox.style.display = 'block';
          }
        }
      }, 3500);

      window.resetAndReloadBrandGuard = function() {
        try {
          localStorage.removeItem('brandguard_guidelines');
          localStorage.removeItem('brandguard_history');
          localStorage.removeItem('brandguard_settings');
          localStorage.removeItem('brandguard_active_draft');
        } catch(e) {}
        window.location.reload();
      };
    })();
  </script>

// BrandGuard AI - Dynamic Deterministic Rule & Heuristic Analysis Engine
(function(window) {
  'use strict';

  const RuleEngine = {
    /**
     * Create a robust RegExp that correctly handles boundary conditions
     * for both alphanumeric words and terms containing symbols (e.g. %, $, #, -).
     */
    createTermRegex: function(term) {
      if (!term || typeof term !== 'string') return null;
      const cleanTerm = term.trim();
      if (!cleanTerm) return null;

      const escaped = cleanTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

      // Check if start and end are word characters
      const startIsWord = /^\w/.test(cleanTerm);
      const endIsWord = /\w$/.test(cleanTerm);

      const prefix = startIsWord ? '\\b' : '(?:^|\\s|[,.!?;:\'"()[\\]{}])';
      const suffix = endIsWord ? '\\b' : '(?=$|\\s|[,.!?;:\'"()[\\]{}])';

      return new RegExp(`${prefix}${escaped}${suffix}`, 'gi');
    },

    /**
     * Analyze submitted text dynamically against the active Brand Guidelines
     */
    analyze: function(text, contentType, guidelines) {
      if (!text || typeof text !== 'string' || text.trim().length === 0) {
        return {
          brandScore: 0,
          scoreTier: 'High Risk',
          scoreExplanation: 'No content provided for analysis.',
          categoryScores: { tone: 100, terminology: 100, claims: 100, facts: 100, accessibility: 100 },
          issues: [],
          stats: { characters: 0, words: 0, sentences: 0, readingTimeMinutes: 0 },
          engine: 'BrandGuard Governance Engine'
        };
      }

      const issues = [];
      const cleanText = text;
      const g = guidelines || {};

      // ==========================================
      // 1. PROHIBITED WORDS & BUZZWORDS (Dynamic)
      // ==========================================
      if (Array.isArray(g.prohibitedWords)) {
        g.prohibitedWords.forEach(banned => {
          if (!banned.term) return;
          const regex = this.createTermRegex(banned.term);
          if (!regex) return;

          let match;
          while ((match = regex.exec(cleanText)) !== null) {
            let matchedText = match[0];
            let startIndex = match.index;

            // If non-word boundary matched leading whitespace/punctuation, adjust
            if (!/^\w/.test(banned.term) && /^[\s,.!?;:\'"()[\\]{}]/.test(matchedText)) {
              matchedText = matchedText.slice(1);
              startIndex += 1;
            }

            const suggestion = Array.isArray(banned.alternatives) && banned.alternatives.length > 0
              ? banned.alternatives[0]
              : (typeof banned.alternatives === 'string' ? banned.alternatives : 'appropriate terminology');

            issues.push({
              id: `issue-banned-${banned.id || Math.random().toString(36).substr(2, 7)}-${startIndex}`,
              title: `Prohibited Buzzword: "${matchedText}"`,
              severity: banned.severity || 'warning',
              category: 'terminology',
              originalText: matchedText,
              startIndex: startIndex,
              endIndex: startIndex + matchedText.length,
              reason: banned.reason || `The term "${matchedText}" is prohibited by corporate brand guidelines.`,
              guidelineViolated: `Brand Guidelines: Prohibited Terminology ("${banned.term}")`,
              suggestedCorrection: this.preserveCapitalization(matchedText, suggestion),
              alternatives: banned.alternatives || []
            });
          }
        });
      }

      // ==========================================
      // 2. APPROVED TERMINOLOGY (Dynamic)
      // ==========================================
      if (Array.isArray(g.terminology)) {
        g.terminology.forEach(termObj => {
          if (!termObj.deprecated || !termObj.approved) return;

          const deprecatedVariants = termObj.deprecated.split('/').map(v => v.trim()).filter(Boolean);

          deprecatedVariants.forEach(variant => {
            const regex = this.createTermRegex(variant);
            if (!regex) return;

            let match;
            while ((match = regex.exec(cleanText)) !== null) {
              let matchedText = match[0];
              let startIndex = match.index;

              if (!/^\w/.test(variant) && /^[\s,.!?;:\'"()[\\]{}]/.test(matchedText)) {
                matchedText = matchedText.slice(1);
                startIndex += 1;
              }

              const primaryApproved = termObj.approved.split('/')[0].trim();

              issues.push({
                id: `issue-term-${termObj.id || Math.random().toString(36).substr(2, 7)}-${startIndex}`,
                title: `Deprecated Terminology: "${matchedText}"`,
                severity: 'warning',
                category: 'terminology',
                originalText: matchedText,
                startIndex: startIndex,
                endIndex: startIndex + matchedText.length,
                reason: termObj.note || `Use approved corporate terminology "${termObj.approved}" instead of "${matchedText}".`,
                guidelineViolated: `Approved Terminology Matrix: ${termObj.category || 'Product'}`,
                suggestedCorrection: this.preserveCapitalization(matchedText, primaryApproved)
              });
            }
          });
        });
      }

      // ==========================================
      // 3. OFFICIAL BRAND FACTS (Dynamic from guidelines.facts)
      // ==========================================
      const factsList = Array.isArray(g.facts) ? g.facts : [];

      // Fact A: Founding Year (Dynamically extracted from guidelines.facts)
      const foundingFactObj = factsList.slice().reverse().find(f => 
        (f.key && /founding|founded|origin/i.test(f.key)) || 
        (f.fact && /founded\s+in\s+\d{4}/i.test(f.fact))
      );

      let targetFoundingYear = '2021';

      const foundingInTextMatch = cleanText.match(/\b(?:founded in|established in|since)\s+(\d{4})\b/i);

            reason: foundingFactObj ? `${foundingFactObj.fact} (Verification: ${foundingFactObj.verification || 'SEC / Corporate Registry'}). Stating ${yearInText} conflicts with official filings.` : `Corporate founding year is ${targetFoundingYear}. Stating ${yearInText} is inaccurate.`,

      if (metricMatch) {

        });
      }

      // 4E. Exaggerated Hyperbolic Panaceas & Blanket Assurances
      const hyperboleRegex = /\b(?:never\s+worry\s+(?:about\s+(?:any\s+problem\s+again|anything\s+again|downtime\s+again)|again)|eliminate\s+all\s+(?:problems?|bugs?|errors?|downtime)|magic(?:al)?\s+fix|cure-all|solve\s+all\s+(?:your\s+)?problems?)\b/gi;
      let hypMatch;
      while ((hypMatch = hyperboleRegex.exec(cleanText)) !== null) {
        const originalMatch = hypMatch[0];
        let correction = 'proactively mitigate operational incidents';
        if (/eliminate/i.test(originalMatch)) {
          correction = 'substantially reduce potential incidents';
        } else if (/magic|cure-all/i.test(originalMatch)) {
          correction = 'systematic resolution framework';
        }
        issues.push({
          id: `issue-tone-hyperbole-${hypMatch.index}`,
          title: `Exaggerated Absolute Assurance: "${originalMatch}"`,
          severity: 'warning',
          category: 'tone',
          originalText: originalMatch,
          startIndex: hypMatch.index,
          endIndex: hypMatch.index + originalMatch.length,
          reason: `Blanket assurances such as "${originalMatch}" represent unrealistic marketing hyperbole that conflicts with transparent, data-backed brand communication.`,
          guidelineViolated: 'Brand Voice: Transparent & Data-Backed Communication',
          suggestedCorrection: this.preserveCapitalization(originalMatch, correction)
        });
      }

      // Check if text uses G2 claim without required season/year citation
      if (Array.isArray(g.claims)) {
        g.claims.forEach(claim => {
          if (claim.title && /G2/i.test(claim.title) && /#1|leader/i.test(cleanText) && /G2/i.test(cleanText)) {
            // Check if year/season is cited
            if (!/Fall\s+2024|Grid\s+Report/i.test(cleanText)) {
              const g2Index = cleanText.search(/G2/i);
              if (g2Index !== -1) {
                issues.push({
                  id: `issue-claim-g2-caveat-${g2Index}`,
                  title: 'Incomplete Marketing Claim Citation (G2)',
                  severity: 'warning',
                  category: 'claims',
                  originalText: 'G2',
                  startIndex: g2Index,
                  endIndex: g2Index + 2,
                  reason: claim.rules || 'Must cite the specific season and year: "G2 Fall 2024 Enterprise Grid Report".',
                  guidelineViolated: `Approved Claim: ${claim.title}`,
                  suggestedCorrection: 'G2 Fall 2024 Enterprise Grid Report'
                });
              }
            }
          }
        });
      }

      // ==========================================
      // 5. BRAND TONE & VOICE (Dynamic sliders & rules)
      // ==========================================
      const formality = g.tone?.sliders?.formality !== undefined ? g.tone.sliders.formality : 75;
      const energy = g.tone?.sliders?.energy !== undefined ? g.tone.sliders.energy : 65;

      // High formality checks (>70)
      if (formality >= 65) {
        const casualRegex = /\b(blow your minds?|kinda|gonna|wanna|super cheap|crazy cool|hella)\b/gi;
        let cMatch;
        while ((cMatch = casualRegex.exec(cleanText)) !== null) {
          issues.push({
            id: `issue-tone-informal-${cMatch.index}`,
            title: `Tone Inconsistency: Casual Phrase ("${cMatch[0]}")`,
            severity: 'warning',
            category: 'tone',
            originalText: cMatch[0],
            startIndex: cMatch.index,
            endIndex: cMatch.index + cMatch[0].length,
            reason: `Current brand formality slider is set to ${formality}% (Professional/Formal). Colloquial idioms diminish enterprise credibility.`,
            guidelineViolated: 'Brand Voice: Professional & Authoritative Formality',
            suggestedCorrection: cMatch[0].toLowerCase().includes('blow your mind') ? 'exceed expectations' : 'streamline operations'
          });
        }
      }

      // Exclamation marks policy
      const multiExclRegex = /(!{2,})/g;
      let exclMatch;
      while ((exclMatch = multiExclRegex.exec(cleanText)) !== null) {
        issues.push({
          id: `issue-tone-exclamation-${exclMatch.index}`,
          title: 'Tone Violation: Multiple Exclamation Marks',
          severity: 'suggestion',
          category: 'tone',
          originalText: exclMatch[0],
          startIndex: exclMatch.index,
          endIndex: exclMatch.index + exclMatch[0].length,
          reason: 'Brand voice rule: Avoid multiple exclamation marks to preserve calm, authoritative confidence.',
          guidelineViolated: 'Brand Voice: Punctuation & Restraint',
          suggestedCorrection: '.'
        });
      }

      // Emoji governance per writingGuidelines
      const emojiRegex = /(\p{Extended_Pictographic})/gu;
      const emojiMatches = cleanText.match(emojiRegex);
      if (emojiMatches && emojiMatches.length > 0) {
        if (contentType === 'press' || contentType === 'docs') {
          const firstEmojiIndex = cleanText.search(emojiRegex);
          issues.push({
            id: `issue-tone-emojis-formal-${firstEmojiIndex}`,
            title: 'Tone Violation: Emojis in Formal Collateral',
            severity: 'warning',
            category: 'tone',
            originalText: emojiMatches.join(' '),
            startIndex: firstEmojiIndex,
            endIndex: firstEmojiIndex + emojiMatches[0].length,
            reason: `Press releases and technical documentation mandate 0 emojis. Detected ${emojiMatches.length} emojis.`,
            guidelineViolated: 'Writing Guidelines: Emoji Governance',
            suggestedCorrection: ''
          });
        } else if (emojiMatches.length > 2) {
          const firstEmojiIndex = cleanText.search(emojiRegex);
          issues.push({
            id: `issue-tone-emojis-excessive-${firstEmojiIndex}`,
            title: `Tone Warning: Emoji Overuse (${emojiMatches.length} emojis)`,
            severity: 'suggestion',
            category: 'tone',
            originalText: emojiMatches.slice(2).join(' '),
            startIndex: firstEmojiIndex,
            endIndex: firstEmojiIndex + emojiMatches[0].length,
            reason: 'Brand guidelines limit social media content to at most 2 contextual emojis.',
            guidelineViolated: 'Writing Guidelines: Social Media Emoji Rules',
            suggestedCorrection: ''
          });
        }
      }

      // ==========================================
      // 6. WRITING GUIDELINES & ACCESSIBILITY (Dynamic)
      // ==========================================
      const maxWords = (g.writingGuidelines && g.writingGuidelines.maxSentenceWords) ? parseInt(g.writingGuidelines.maxSentenceWords, 10) : 26;
      const sentences = cleanText.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);

      sentences.forEach(sentence => {
        const words = sentence.trim().split(/\s+/).filter(Boolean);
        if (words.length > maxWords) {
          const index = cleanText.indexOf(sentence);
          if (index !== -1) {
            issues.push({
              id: `issue-access-length-${index}`,
              title: `Accessibility Concern: Run-on Sentence (${words.length} words)`,
              severity: 'suggestion',
              category: 'accessibility',
              originalText: sentence.substring(0, Math.min(sentence.length, 65)) + '...',
              startIndex: index,
              endIndex: index + sentence.length,
              reason: `Sentences longer than ${maxWords} words reduce cognitive accessibility for global enterprise practitioners. Consider splitting into two concise statements.`,
              guidelineViolated: `Writing Guidelines: Max Sentence Length (${maxWords} words)`,
              suggestedCorrection: sentence.replace(/,\s*(and|which|making|while)\s+/i, '. Furthermore, ')
            });
          }
        }
      });

      // Sort issues by index in text
      issues.sort((a, b) => a.startIndex - b.startIndex);

      // Deduplicate issues sharing overlapping or identical spans
      // Sort issues by span length descending so larger encompassing spans take precedence
      issues.sort((a, b) => (b.endIndex - b.startIndex) - (a.endIndex - a.startIndex));

      const uniqueIssues = [];
      issues.forEach(iss => {
        const hasOverlap = uniqueIssues.some(existing => {
          const overlapStart = Math.max(iss.startIndex, existing.startIndex);
          const overlapEnd = Math.min(iss.endIndex, existing.endIndex);
          return overlapEnd > overlapStart;
        });

        if (!hasOverlap) {
          uniqueIssues.push(iss);
        }
      });

      // Sort issues by appearance in text
      uniqueIssues.sort((a, b) => a.startIndex - b.startIndex);

      // Calculate score
      const scoreCalc = this.calculateBrandScore(uniqueIssues);

      const wordsCount = cleanText.trim().split(/\s+/).filter(Boolean).length;
      const readingMinutes = Math.max(1, Math.ceil(wordsCount / 200));

      return {
        brandScore: scoreCalc.score,
        scoreTier: scoreCalc.tier,
        scoreExplanation: scoreCalc.explanation,
        categoryScores: scoreCalc.categoryScores,
        issues: uniqueIssues,
        counts: scoreCalc.counts,
        summary: {
          totalIssues: uniqueIssues.length,
          criticalCount: scoreCalc.counts.critical,
          warningCount: scoreCalc.counts.warning,
          suggestionCount: scoreCalc.counts.suggestion
        },
        stats: {
          characters: cleanText.length,
          words: wordsCount,
          sentences: sentences.length,
          readingTimeMinutes: readingMinutes
        },
        engine: 'BrandGuard Dynamic Governance Engine'
      };
    },

    /**
     * Compute brand governance score (0 - 100)
     */
    calculateBrandScore: function(issues) {
      let score = 100;
      let criticalCount = 0;
      let warningCount = 0;
      let suggestionCount = 0;

      const categoryDeductions = {
        tone: 0,
        terminology: 0,
        claims: 0,
        facts: 0,
        accessibility: 0
      };

      issues.forEach(issue => {
        let deduction = 0;
        if (issue.severity === 'critical') {
          deduction = 20;
          criticalCount++;
        } else if (issue.severity === 'warning') {
          deduction = 10;
          warningCount++;
        } else {
          deduction = 4;
          suggestionCount++;
        }

        score -= deduction;

        const cat = issue.category || 'tone';
        if (categoryDeductions[cat] !== undefined) {
          categoryDeductions[cat] += deduction;
        }
      });

      score = Math.max(10, Math.min(100, score));

      let tier = 'Exemplary';
      let explanation = 'Content demonstrates full compliance with approved brand tone, certified claims, and enterprise governance standards (no factual conflicts detected).';

      if (score < 50) {
        tier = 'High Risk';
        explanation = `Critical legal, claim, or factual conflicts detected (${criticalCount} critical, ${warningCount} warnings). Content requires substantial remediation before publication.`;
      } else if (score < 75) {
        tier = 'Needs Revision';
        explanation = `Content contains notable warnings and terminology deviations (${warningCount} warnings, ${suggestionCount} suggestions). Reviewer adjustments recommended.`;
      } else if (score < 90) {
        tier = 'Good';
        explanation = `Content is largely compliant with minor stylistic or accessibility suggestions (${suggestionCount} suggestions).`;
      }

      const categoryScores = {
        tone: Math.max(20, Math.round(100 - (categoryDeductions.tone * 2.5))),
        terminology: Math.max(20, Math.round(100 - (categoryDeductions.terminology * 2))),
        claims: Math.max(20, Math.round(100 - (categoryDeductions.claims * 2.5))),
        facts: Math.max(20, Math.round(100 - (categoryDeductions.facts * 2.5))),
        accessibility: Math.max(30, Math.round(100 - (categoryDeductions.accessibility * 3)))
      };

      return {
        score: Math.round(score),
        tier: tier,
        explanation: explanation,
        categoryScores: categoryScores,
        counts: {
          critical: criticalCount,
          warning: warningCount,
          suggestion: suggestionCount,
          total: issues.length
        }
      };
    },

    /**
     * Capitalization helper to preserve original casing
     */
    preserveCapitalization: function(original, replacement) {
      if (!original || !replacement) return replacement;
      if (original === original.toUpperCase() && original.length > 1) {
        return replacement.toUpperCase();
      }
      if (original[0] === original[0].toUpperCase()) {
        return replacement.charAt(0).toUpperCase() + replacement.slice(1);
      }
      return replacement.toLowerCase();
    }
  };

  window.RuleEngine = RuleEngine;

})(window);

OUTPUT FORMAT:
Return a valid JSON object with EXACTLY this structure:

  "scoreTier": "Good", // "Exemplary" (90-100) | "Good" (75-89) | "Needs Revision" (50-74) | "High Risk" (0-49)
  "scoreExplanation": "Explanation of score...",

  },

  "issues": [

      "category": "terminology", // "tone" | "terminology" | "claims" | "facts" | "accessibility"

    }
  ]
}

CRITICAL: Return ONLY raw valid JSON. Do not wrap in markdown or backticks.`;

    cleanAndParseJSON: function(raw) {

      if (clean.startsWith('```')) {
        clean = clean.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
      }
      return JSON.parse(clean);
    },

    reconcileIssueIndices: function(fullText, issues) {
      return issues.map((issue, idx) => {
        let start = -1;
        let end = -1;
        const target = issue.originalText;

        if (target && fullText.includes(target)) {
          start = fullText.indexOf(target);
          end = start + target.length;
        }

        return {
          id: issue.id || `issue-ai-${idx}-${Date.now()}`,
          title: issue.title || 'Brand Governance Issue',
          severity: (issue.severity || 'warning').toLowerCase(),
          category: (issue.category || 'tone').toLowerCase(),
          originalText: issue.originalText || '',
          startIndex: start,
          endIndex: end,
          reason: issue.reason || 'Flagged by Brand Governance AI.',
          guidelineViolated: issue.guidelineViolated || 'Brand Guidelines Policy',
          suggestedCorrection: issue.suggestedCorrection || ''
        };

    },

})(window);

  }) => {

    const savedDraft = !initialContent && window.StorageService ? window.StorageService.getActiveDraft() : null;

    // Content state (handle empty string properly without falling back to demo)
    const [title, setTitle] = React.useState(
      initialContent?.title !== undefined 
        ? initialContent.title 
        : (savedDraft?.title || 'Q4 Product Launch - Cloud Observability Announcement')
    );
    const [contentType, setContentType] = React.useState(
      initialContent?.contentType !== undefined 
        ? initialContent.contentType 
        : (savedDraft?.contentType || 'ad')
    );
    const [content, setContent] = React.useState(
      initialContent?.content !== undefined 
        ? initialContent.content 
        : (savedDraft?.content !== undefined ? savedDraft.content : (window.BrandGuardDemos ? window.BrandGuardDemos.samples[0].content : ''))
    );

    // Auto-save active draft to LocalStorage so state survives refresh
    React.useEffect(() => {
      if (window.StorageService && !initialContent?.id) {
        window.StorageService.saveActiveDraft({
          title,
          contentType,
          content
        });
      }
    }, [title, contentType, content]);

    // Analysis state
    const [isAnalyzing, setIsAnalyzing] = React.useState(false);
    const [analysisProgress, setAnalysisProgress] = React.useState({ step: '', percent: 0 });
    const [analysisResult, setAnalysisResult] = React.useState(null);
    const [activeTabMode, setActiveTabMode] = React.useState('overlay'); // 'overlay' | 'editor'

    // Issue filtering and management
    const [selectedIssueId, setSelectedIssueId] = React.useState(null);
    const [severityFilter, setSeverityFilter] = React.useState('all');
    const [categoryFilter, setCategoryFilter] = React.useState('all');
    const [appliedIssueIds, setAppliedIssueIds] = React.useState(new Set());
    const [ignoredIssueIds, setIgnoredIssueIds] = React.useState(new Set());
    const [undoStack, setUndoStack] = React.useState([]);

    // Remediation Studio state
    const [originalAnalyzedContent, setOriginalAnalyzedContent] = React.useState('');
    const [correctedContentDraft, setCorrectedContentDraft] = React.useState('');

    // Workflow state
    const [reviewStatus, setReviewStatus] = React.useState(initialContent?.status || 'draft');
    const [reviewNotes, setReviewNotes] = React.useState('');
    const [showReviewModal, setShowReviewModal] = React.useState(false);
    const [reviewerAction, setReviewerAction] = React.useState(null); // 'approve' | 'reject'

    // Real-time text statistics
    const stats = React.useMemo(() => {
      const trimmed = content.trim();
      const chars = content.length;
      const words = trimmed.length > 0 ? trimmed.split(/\s+/).filter(Boolean).length : 0;
      const sentences = trimmed.length > 0 ? trimmed.split(/(?<=[.!?])\s+/).filter(Boolean).length : 0;
      const readingMinutes = Math.max(1, Math.ceil(words / 200));
      return { chars, words, sentences, readingMinutes };
    }, [content]);

    // Character recommendations per content type
    const characterLimits = {
      social: { recommended: 280, max: 3000, label: 'Social Post' },
      email: { recommended: 800, max: 2500, label: 'Email Copy' },
      ad: { recommended: 350, max: 1000, label: 'Ad Copy' },
      article: { recommended: 3000, max: 10000, label: 'Article / Blog' },
      press: { recommended: 1500, max: 5000, label: 'Press Release' },
      docs: { recommended: 2000, max: 8000, label: 'Documentation' }
    };

    // Load Demo Preset
    const handleLoadPreset = (presetId) => {
      const preset = window.BrandGuardDemos?.samples.find(s => s.id === presetId);
      if (preset) {
        setTitle(preset.title);
        setContentType(preset.type);
        setContent(preset.content);
        setAnalysisResult(null);
        setAppliedIssueIds(new Set());
        setIgnoredIssueIds(new Set());
        setReviewStatus('draft');
        if (showToast) showToast(`Loaded demo: "${preset.name}"`, 'info');
      }
    };

    // Clear content for fresh draft
    const handleClearContent = () => {
      setTitle('Untitled Content Draft');
      setContent('');
      setAnalysisResult(null);
      setAppliedIssueIds(new Set());
      setIgnoredIssueIds(new Set());
      setReviewStatus('draft');
      setActiveTabMode('editor');
      if (window.StorageService) window.StorageService.clearActiveDraft();
      if (showToast) showToast('Editor cleared. Ready for new content draft.', 'info');
    };

    // Trigger AI / Heuristic Analysis
    const handleRunAnalysis = async () => {
      if (!content || !content.trim()) {
        if (showToast) showToast('Please enter or paste content to analyze.', 'warning');
        return;
      }

      setIsAnalyzing(true);
      setAnalysisProgress({ step: 'Initializing BrandGuard AI...', percent: 5 });

      try {
        const result = await window.GeminiService.analyzeContent(
          content,
          contentType,
          guidelines,
          progress => setAnalysisProgress(progress)
        );

        setAnalysisResult(result);
        setAppliedIssueIds(new Set());
        setIgnoredIssueIds(new Set());
        setOriginalAnalyzedContent(content);
        const autoCorrected = generateRewrittenDraft(content, result.issues);
        setCorrectedContentDraft(autoCorrected);
        setActiveTabMode('overlay');

        if (result.issues.length === 0) {
          if (showToast) showToast('Exemplary! Zero brand governance issues detected.', 'success');
        } else {
          if (showToast) {
            showToast(
              `Analysis complete: ${result.issues.length} issues flagged. Governance score: ${result.brandScore}/100.`,
              result.brandScore >= 75 ? 'info' : 'warning'
            );
          }
        }
      } catch (err) {
        console.error('Analysis error:', err);
        if (showToast) showToast(`Analysis failed: ${err.message}`, 'error');
      } finally {
        setIsAnalyzing(false);
      }
    };

    // Apply an individual correction
    const handleApplyCorrection = (issue) => {
      if (!issue || !issue.suggestedCorrection) return;

      const target = issue.originalText;
      const replacement = issue.suggestedCorrection;

      if (!content.includes(target)) {
        if (showToast) showToast(`Could not find snippet "${target}" in current text.`, 'warning');
        return;
      }

      // Save previous state to undo stack
      const previousContent = content;
      setUndoStack(prev => [{ content: previousContent, issueId: issue.id, desc: `Replaced "${target}" with "${replacement}"` }, ...prev]);

      // Perform clean replacement
      const newContent = content.replace(target, replacement);
      setContent(newContent);

      // Mark issue as applied
      const newApplied = new Set(appliedIssueIds);
      newApplied.add(issue.id);
      setAppliedIssueIds(newApplied);

      // Recalculate score dynamically
      recalculateDynamicScore(newApplied, ignoredIssueIds);

      if (showToast) {
        showToast(`Applied correction: "${replacement}" (Score updated)`, 'success', {
          actionLabel: 'Undo',
          onAction: () => handleUndo()
        });
      }
    };

    // Undo last applied correction
    const handleUndo = () => {
      if (undoStack.length === 0) return;
      const [lastUndo, ...rest] = undoStack;
      setContent(lastUndo.content);
      setUndoStack(rest);

      const newApplied = new Set(appliedIssueIds);
      newApplied.delete(lastUndo.issueId);
      setAppliedIssueIds(newApplied);

      recalculateDynamicScore(newApplied, ignoredIssueIds);
      if (showToast) showToast('Undid last correction.', 'info');
    };

    // Ignore an issue
    const handleIgnoreIssue = (issue) => {
      const newIgnored = new Set(ignoredIssueIds);
      newIgnored.add(issue.id);
      setIgnoredIssueIds(newIgnored);

      recalculateDynamicScore(appliedIssueIds, newIgnored);
      if (showToast) showToast(`Issue "${issue.title}" dismissed.`, 'info');
    };

    // Apply All Safe Corrections
    const handleApplyAllCorrections = () => {
      if (!analysisResult || !analysisResult.issues) return;

      const actionableIssues = analysisResult.issues.filter(
        iss => !appliedIssueIds.has(iss.id) && !ignoredIssueIds.has(iss.id) && iss.suggestedCorrection
      );

      if (actionableIssues.length === 0) {
        if (showToast) showToast('No remaining corrections to apply.', 'info');
        return;
      }

      // Save previous state for global undo
      setUndoStack(prev => [{ content: content, issueId: 'all', desc: `Applied all ${actionableIssues.length} safe corrections` }, ...prev]);

      let updatedContent = content;
      const newApplied = new Set(appliedIssueIds);

      actionableIssues.forEach(iss => {
        if (updatedContent.includes(iss.originalText)) {
          updatedContent = updatedContent.replace(iss.originalText, iss.suggestedCorrection);
          newApplied.add(iss.id);
        }
      });

      setContent(updatedContent);
      setAppliedIssueIds(newApplied);
      recalculateDynamicScore(newApplied, ignoredIssueIds);

      if (showToast) {
        showToast(`Applied all ${actionableIssues.length} safe corrections! Brand score updated.`, 'success', {
          actionLabel: 'Undo All',
          onAction: () => handleUndo()
        });
      }
    };

    // Generate full rewritten version of content preserving meaning
    const generateRewrittenDraft = (sourceText, issuesList) => {
      let draft = sourceText || '';
      const actionable = (issuesList || [])
        .filter(iss => iss.suggestedCorrection && iss.originalText)
        .sort((a, b) => b.originalText.length - a.originalText.length);

      actionable.forEach(iss => {
        if (draft.includes(iss.originalText)) {
          draft = draft.replace(iss.originalText, iss.suggestedCorrection);
        }
      });
      return draft;
    };

    // Fix All Issues (Remediation Studio)
    const handleFixAllIssues = () => {
      if (!analysisResult || !analysisResult.issues || analysisResult.issues.length === 0) {
        if (showToast) showToast('No detected issues to fix.', 'info');
        return;
      }

      const actionableIssues = analysisResult.issues.filter(
        iss => !appliedIssueIds.has(iss.id) && !ignoredIssueIds.has(iss.id) && iss.suggestedCorrection
      );

      if (actionableIssues.length === 0) {
        if (showToast) showToast('All actionable corrections have already been applied.', 'info');
        return;
      }

      const baseText = originalAnalyzedContent || content;
      const rewritten = generateRewrittenDraft(baseText, actionableIssues);
      setCorrectedContentDraft(rewritten);
      setActiveTabMode('diff');

      if (showToast) {
        showToast(
          `Generated corrected draft addressing ${actionableIssues.length} issues! Compare and edit below.`,
          'success'
        );
      }
    };

    // Apply Corrected Draft to Document
    const handleApplyCorrectedDraft = () => {
      if (!correctedContentDraft) return;

      setUndoStack(prev => [{ content: content, issueId: 'all-diff', desc: 'Pre-remediation snapshot' }, ...prev]);

      const newContent = correctedContentDraft;
      setContent(newContent);

      const allActionableIds = (analysisResult?.issues || [])
        .filter(iss => iss.suggestedCorrection)
        .map(iss => iss.id);
      const newApplied = new Set([...appliedIssueIds, ...allActionableIds]);
      setAppliedIssueIds(newApplied);

      recalculateDynamicScore(newApplied, ignoredIssueIds);

      if (window.StorageService) {
        window.StorageService.saveActiveDraft({
          title: title || 'Untitled Content Draft',
          contentType,
          content: newContent
        });
      }

      setActiveTabMode('overlay');
      if (showToast) {
        showToast('Applied corrected copy to active document! Brand score updated.', 'success', {
          actionLabel: 'Undo',
          onAction: () => handleUndo()
        });
      }
    };

    // Re-analyze Corrected Draft
    const handleReanalyzeCorrectedDraft = async () => {
      const targetText = correctedContentDraft || content;
      if (!targetText || !targetText.trim()) {
        if (showToast) showToast('No content available to re-analyze.', 'warning');
        return;
      }

      setUndoStack(prev => [{ content: content, issueId: 'reanalyze-diff', desc: 'Pre-reanalysis snapshot' }, ...prev]);
      setContent(targetText);
      setOriginalAnalyzedContent(targetText);

      setIsAnalyzing(true);
      setAnalysisProgress({ step: 'Re-analyzing corrected content against governance rules...', percent: 20 });

      try {
        const result = await window.GeminiService.analyzeContent(
          targetText,
          contentType,
          guidelines,
          progress => setAnalysisProgress(progress)
        );

        setAnalysisResult(result);
        setAppliedIssueIds(new Set());
        setIgnoredIssueIds(new Set());

        const nextDraft = generateRewrittenDraft(targetText, result.issues);
        setCorrectedContentDraft(nextDraft);
        setActiveTabMode('overlay');

        if (window.StorageService) {
          window.StorageService.saveActiveDraft({
            title: title || 'Untitled Content Draft',
            contentType,
            content: targetText
          });
        }

        if (result.issues.length === 0) {
          if (showToast) showToast(`Re-analysis complete! Exemplary compliance score: ${result.brandScore}/100. Zero issues remaining.`, 'success');
        } else {
          if (showToast) {
            showToast(
              `Re-analysis complete: ${result.issues.length} issues remaining. Governance score: ${result.brandScore}/100.`,
              result.brandScore >= 75 ? 'info' : 'warning'
            );
          }
        }
      } catch (err) {
        console.error('Re-analysis error:', err);
        if (showToast) showToast(`Re-analysis failed: ${err.message}`, 'error');
      } finally {
        setIsAnalyzing(false);
      }
    };

    // Dynamically recalculate brand score after corrections
    const recalculateDynamicScore = (appliedSet, ignoredSet) => {
      if (!analysisResult || !analysisResult.issues) return;

      const remainingIssues = analysisResult.issues.filter(
        iss => !appliedSet.has(iss.id) && !ignoredSet.has(iss.id)
      );

      const recalculated = window.RuleEngine.calculateBrandScore(remainingIssues);

      setAnalysisResult(prev => ({
        ...prev,
        brandScore: recalculated.score,
        scoreTier: recalculated.tier,
        scoreExplanation: recalculated.explanation,
        categoryScores: recalculated.categoryScores
      }));
    };

    // Filtered issues
    const filteredIssues = React.useMemo(() => {
      if (!analysisResult?.issues) return [];
      return analysisResult.issues.filter(iss => {
        if (severityFilter !== 'all' && iss.severity !== severityFilter) return false;
        if (categoryFilter !== 'all' && iss.category !== categoryFilter) return false;
        return true;
      });
    }, [analysisResult, severityFilter, categoryFilter]);

    // Save record to history
    const handleSaveRecord = () => {
      const record = {
        id: initialContent?.id || `check-${Date.now()}`,
        title: title || 'Untitled Content Draft',
        contentType: contentType,
        content: content,
        brandScore: analysisResult ? analysisResult.brandScore : 100,
        scoreTier: analysisResult ? analysisResult.scoreTier : 'Exemplary',
        status: reviewStatus,
        issuesCount: analysisResult ? analysisResult.issues.length : 0,
        resolvedIssuesCount: appliedIssueIds.size,
        reviewer: reviewStatus === 'approved' ? (settings.reviewerName || 'Jane Doe') : null,
        reviewNote: reviewNotes || null,
        auditLog: [
          ...(initialContent?.auditLog || []),
          {
            timestamp: new Date().toISOString(),
            actor: activeRole === 'author' ? (settings.authorName || 'Alex Rivera') : (settings.reviewerName || 'Jane Doe'),
            action: `Saved Record (Status: ${reviewStatus.replace('_', ' ')})`
          }
        ]
      };

      if (onSaveToHistory) onSaveToHistory(record);
      if (showToast) showToast('Content check saved to library and history.', 'success');
    };

    // Submit for Review (Author Action)
    const handleSubmitForReview = () => {
      setReviewStatus('pending_approval');
      handleSaveRecord();
      if (showToast) showToast('Draft submitted to Review Queue for brand manager approval!', 'success');
    };

    // Reviewer Approve Action
    const handleReviewerApprove = () => {
      setReviewStatus('approved');
      const updatedAudit = [
        ...(initialContent?.auditLog || []),
        {
          timestamp: new Date().toISOString(),
          actor: settings.reviewerName || 'Jane Doe',
          action: 'Approved Content for Publication',
          note: reviewNotes || 'Content complies with enterprise brand guidelines.'
        }
      ];

      const record = {
        id: initialContent?.id || `check-${Date.now()}`,
        title: title,
        contentType: contentType,
        content: content,
        brandScore: analysisResult ? analysisResult.brandScore : 100,
        scoreTier: analysisResult ? analysisResult.scoreTier : 'Exemplary',
        status: 'approved',
        reviewer: settings.reviewerName || 'Jane Doe',
        reviewedAt: new Date().toISOString(),
        reviewNote: reviewNotes,
        issuesCount: analysisResult ? analysisResult.issues.length : 0,
        resolvedIssuesCount: appliedIssueIds.size,
        auditLog: updatedAudit
      };

      if (onSaveToHistory) onSaveToHistory(record);
      setShowReviewModal(false);
      if (showToast) showToast('Content approved and stamped with governance certification!', 'success');
    };

    // Reviewer Request Changes Action
    const handleReviewerRequestChanges = () => {
      if (!reviewNotes.trim()) {
        if (showToast) showToast('Please enter revision feedback notes for the author.', 'warning');
        return;
      }

      setReviewStatus('needs_revision');
      const updatedAudit = [
        ...(initialContent?.auditLog || []),
        {
          timestamp: new Date().toISOString(),
          actor: settings.reviewerName || 'Jane Doe',
          action: 'Requested Revisions',
          note: reviewNotes
        }
      ];

      const record = {
        id: initialContent?.id || `check-${Date.now()}`,
        title: title,
        contentType: contentType,
        content: content,
        brandScore: analysisResult ? analysisResult.brandScore : 100,
        scoreTier: analysisResult ? analysisResult.scoreTier : 'Needs Revision',
        status: 'needs_revision',
        reviewer: settings.reviewerName || 'Jane Doe',
        reviewedAt: new Date().toISOString(),
        reviewNote: reviewNotes,
        issuesCount: analysisResult ? analysisResult.issues.length : 0,
        resolvedIssuesCount: appliedIssueIds.size,
        auditLog: updatedAudit
      };

      if (onSaveToHistory) onSaveToHistory(record);
      setShowReviewModal(false);
      if (showToast) showToast('Status updated to Needs Revision with reviewer comments.', 'warning');
    };

    // Render original copy with problematic flagged snippets highlighted
    const renderOriginalContentWithHighlights = () => {
      const baseText = originalAnalyzedContent || content;
      if (!analysisResult?.issues || analysisResult.issues.length === 0) {
        return <span>{baseText}</span>;
      }

      const activeIssues = analysisResult.issues.filter(iss => iss.originalText);
      if (activeIssues.length === 0) {
        return <span>{baseText}</span>;
      }

      let cursor = 0;
      const elements = [];
      const sorted = [...activeIssues]
        .map(iss => ({ ...iss, index: baseText.indexOf(iss.originalText) }))
        .filter(iss => iss.index !== -1)
        .sort((a, b) => a.index - b.index);

      sorted.forEach((iss, i) => {
        if (iss.index > cursor) {
          elements.push(
            <span key={`orig-txt-${cursor}`}>{baseText.substring(cursor, iss.index)}</span>
          );
        }
        elements.push(
          <span
            key={`orig-hl-${iss.id}-${i}`}
            className="bg-rose-500/20 text-rose-300 px-1 py-0.5 rounded font-medium border border-rose-500/30 line-through"
            title={`${iss.title} (${iss.category}): ${iss.reason}`}
          >
            {iss.originalText}
          </span>
        );
        cursor = Math.max(cursor, iss.index + iss.originalText.length);
      });

      if (cursor < baseText.length) {
        elements.push(
          <span key={`orig-txt-end`}>{baseText.substring(cursor)}</span>
        );
      }

      return elements;
    };

    // Render Side-by-Side Remediation Studio & Diff Comparison
    const renderDiffComparisonView = () => {
      const baseText = originalAnalyzedContent || content;
      const originalWords = baseText.trim().split(/\s+/).filter(Boolean).length;
      const correctedWords = (correctedContentDraft || '').trim().split(/\s+/).filter(Boolean).length;
      const actionableCount = analysisResult?.issues?.filter(
        iss => !appliedIssueIds.has(iss.id) && !ignoredIssueIds.has(iss.id) && iss.suggestedCorrection
      ).length || 0;

      return (
        <div className="space-y-4 animate-fadeIn">
          {/* Header Action Bar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 shadow-sm">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
              <h4 className="text-xs sm:text-sm font-bold text-white">
                Content Remediation Studio
              </h4>
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/30">
                {actionableCount} Proposed Fix{actionableCount === 1 ? '' : 'es'}
              </span>
            </div>

            <div className="flex items-center gap-2">
              {/* Quick Reset Button */}
              <button
                type="button"
                onClick={() => {
                  const refreshed = generateRewrittenDraft(baseText, analysisResult?.issues || []);
                  setCorrectedContentDraft(refreshed);
                  if (showToast) showToast('Reset corrected draft to rule suggestions.', 'info');
                }}
                className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition-colors"
                title="Reset corrected draft to original suggestions"
              >
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Reset</span>
              </button>

              {/* Apply Corrections Button */}
              <button
                type="button"
                onClick={handleApplyCorrectedDraft}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition-all"
                title="Apply corrected content to document"
              >
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                </svg>
                <span>Apply Corrections</span>
              </button>

              {/* Re-analyze Button */}
              <button
                type="button"
                onClick={handleReanalyzeCorrectedDraft}
                disabled={isAnalyzing || !correctedContentDraft.trim()}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 hover:bg-cyan-500 text-white shadow-sm transition-all disabled:opacity-50"
                title="Re-analyze corrected content and recalculate score"
              >
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Re-Analyze Draft</span>
              </button>
            </div>
          </div>

          {/* Two-Column Side by Side Panels */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {/* Left Panel: Original Content */}
            <div className="bg-slate-950/80 rounded-xl border border-slate-800/90 p-4 flex flex-col">
              <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-800/80">
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                  <span className="text-xs font-bold text-slate-200 uppercase tracking-wider">
                    Original Problematic Copy
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 font-mono">
                  {originalWords} words
                </span>
              </div>
              <div className="flex-1 min-h-[220px] max-h-[380px] overflow-y-auto text-xs sm:text-sm text-slate-300 leading-relaxed font-sans pr-1 whitespace-pre-wrap">
                {renderOriginalContentWithHighlights()}
              </div>
            </div>

            {/* Right Panel: Corrected Content (Editable) */}
            <div className="bg-slate-950/80 rounded-xl border-2 border-indigo-500/40 p-4 flex flex-col shadow-inner">
              <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-800/80">
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                    Remediated Copy (Editable)
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 font-mono">
                  {correctedWords} words
                </span>
              </div>
              <textarea
                value={correctedContentDraft}
                onChange={e => setCorrectedContentDraft(e.target.value)}
                placeholder="Corrected copy will appear here for manual editing..."
                className="w-full flex-1 min-h-[220px] max-h-[380px] bg-transparent text-slate-100 placeholder-slate-400 resize-none focus:outline-none border-none leading-relaxed text-xs sm:text-sm font-sans"
              />
              <div className="pt-2 border-t border-slate-800/60 text-[11px] text-slate-400 flex items-center justify-between">
                <span>✏️ Manually edit or fine-tune this text before applying.</span>
                <span className="text-emerald-400 font-medium">Auto-synced</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render interactive text highlights
    const renderHighlightedContent = () => {
      if (!analysisResult?.issues || analysisResult.issues.length === 0) {
        return <p className="text-slate-200 whitespace-pre-wrap leading-relaxed">{content}</p>;
      }

      const activeIssues = analysisResult.issues.filter(
        iss => !appliedIssueIds.has(iss.id) && !ignoredIssueIds.has(iss.id) && iss.originalText
      );

      if (activeIssues.length === 0) {
        return (
          <div>
            <div className="mb-3 px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold flex items-center gap-2">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
              </svg>
              All flagged brand issues resolved! Content is pristine.
            </div>
            <p className="text-slate-200 whitespace-pre-wrap leading-relaxed">{content}</p>
          </div>
        );
      }

      // Build sorted slices
      let cursor = 0;
      const elements = [];

      // Sort by appearance in current text
      const sorted = [...activeIssues]
        .map(iss => ({ ...iss, index: content.indexOf(iss.originalText) }))
        .filter(iss => iss.index !== -1)
        .sort((a, b) => a.index - b.index);

      sorted.forEach((iss, i) => {
        if (iss.index > cursor) {
          elements.push(
            <span key={`text-${cursor}`}>{content.substring(cursor, iss.index)}</span>
          );
        }

        const isSelected = selectedIssueId === iss.id;
        let hlClass = 'hl-warning';
        if (iss.severity === 'critical') hlClass = 'hl-critical';
        else if (iss.severity === 'suggestion') hlClass = 'hl-suggestion';

        elements.push(
          <mark
            key={`hl-${iss.id}-${i}`}
            onClick={() => setSelectedIssueId(iss.id)}
            className={`highlight-marker ${hlClass} ${isSelected ? 'active' : ''}`}
            title={`${iss.title} - Click to inspect`}
          >
            {iss.originalText}
          </mark>
        );

        cursor = Math.max(cursor, iss.index + iss.originalText.length);
      });

      if (cursor < content.length) {
        elements.push(
          <span key={`text-end-${cursor}`}>{content.substring(cursor)}</span>
        );
      }

      return (
        <div className="text-slate-200 whitespace-pre-wrap leading-relaxed select-text">
          {elements}
        </div>
      );
    };

              <div className="flex items-center justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={() => setShowReviewModal(false)}
                  className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700"
                >
                  Cancel
                </button>

                <button
                  type="button"
                  onClick={reviewerAction === 'approve' ? handleReviewerApprove : handleReviewerRequestChanges}
                  className={`px-4 py-2 rounded-xl text-xs font-bold text-white shadow-md ${

                      ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/20'
                      : 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/20'
                  }`}
                >
                  {reviewerAction === 'approve' ? 'Confirm Approval' : 'Send Revisions'}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  window.ContentChecker = ContentChecker;

})(window);

// BrandGuard AI - Brand Guidelines Management Component
(function(window) {
  'use strict';

  const GuidelinesView = ({
    guidelines,
    onSaveGuidelines,
    onResetGuidelines,
    showToast
  }) => {
    const [activeSection, setActiveSection] = React.useState('terminology'); // 'tone' | 'terminology' | 'banned' | 'facts' | 'claims' | 'writing'
    const [searchQuery, setSearchQuery] = React.useState('');
    const [editingItem, setEditingItem] = React.useState(null); // for modal
    const [isAddModalOpen, setIsAddModalOpen] = React.useState(false);
    const [modalType, setModalType] = React.useState('terminology'); // which category to add

    // New item form state
    const [formData, setFormData] = React.useState({});

    // Filter items based on search query
    const filteredTerminology = React.useMemo(() => {
      const list = guidelines.terminology || [];
      if (!searchQuery.trim()) return list;
      const q = searchQuery.toLowerCase();
      return list.filter(t => t.deprecated.toLowerCase().includes(q) || t.approved.toLowerCase().includes(q) || (t.category && t.category.toLowerCase().includes(q)));
    }, [guidelines.terminology, searchQuery]);

    const filteredProhibited = React.useMemo(() => {
      const list = guidelines.prohibitedWords || [];
      if (!searchQuery.trim()) return list;
      const q = searchQuery.toLowerCase();
      return list.filter(b => b.term.toLowerCase().includes(q) || b.reason.toLowerCase().includes(q));
    }, [guidelines.prohibitedWords, searchQuery]);

    const filteredFacts = React.useMemo(() => {
      const list = guidelines.facts || [];
      if (!searchQuery.trim()) return list;
      const q = searchQuery.toLowerCase();
      return list.filter(f => f.key.toLowerCase().includes(q) || f.fact.toLowerCase().includes(q));
    }, [guidelines.facts, searchQuery]);

    const filteredClaims = React.useMemo(() => {
      const list = guidelines.claims || [];
      if (!searchQuery.trim()) return list;
      const q = searchQuery.toLowerCase();
      return list.filter(c => c.title.toLowerCase().includes(q) || c.claimText.toLowerCase().includes(q));
    }, [guidelines.claims, searchQuery]);

    // Handle delete item
    const handleDeleteItem = (section, id) => {
      const updated = { ...guidelines };
      if (section === 'terminology') {
        updated.terminology = updated.terminology.filter(item => item.id !== id);
      } else if (section === 'banned') {
        updated.prohibitedWords = updated.prohibitedWords.filter(item => item.id !== id);
      } else if (section === 'facts') {
        updated.facts = updated.facts.filter(item => item.id !== id);
      } else if (section === 'claims') {
        updated.claims = updated.claims.filter(item => item.id !== id);
      }

      onSaveGuidelines(updated);
      if (showToast) showToast('Guideline entry removed.', 'info');
    };

    const [newToneRule, setNewToneRule] = React.useState('');

    // Open add modal
    const openAddModal = (type) => {
      setModalType(type);
      setEditingItem(null);
      if (type === 'terminology') {
        setFormData({ deprecated: '', approved: '', category: 'Product', note: '' });
      } else if (type === 'banned') {
        setFormData({ term: '', severity: 'warning', category: 'Cliché & Buzzwords', reason: '', alternatives: '' });
      } else if (type === 'facts') {
        setFormData({ key: '', fact: '', verification: '', guideline: '' });
      } else if (type === 'claims') {
        setFormData({ title: '', claimText: '', substantiation: '', rules: '' });
      } else if (type === 'writing') {
        setFormData({
          maxSentenceWords: guidelines.writingGuidelines?.maxSentenceWords || 26,
          targetReadingGrade: guidelines.writingGuidelines?.targetReadingGrade || '8th to 10th Grade (Clear & Accessible)',
          emojiSocial: guidelines.writingGuidelines?.emojiRules?.social || 'Maximum 2 relevant emojis',
          emojiFormal: guidelines.writingGuidelines?.emojiRules?.formal || 'Strictly 0 emojis in formal documentation',
          punctuation: guidelines.writingGuidelines?.punctuation || 'Serial (Oxford) comma is mandatory'
        });
      }
      setIsAddModalOpen(true);
    };

    // Open edit modal
    const openEditModal = (type, item) => {
      setModalType(type);
      setEditingItem(item);
      if (type === 'banned') {
        setFormData({
          ...item,
          alternatives: Array.isArray(item.alternatives) ? item.alternatives.join(', ') : item.alternatives
        });
      } else if (type === 'writing') {
        setFormData({
          maxSentenceWords: guidelines.writingGuidelines?.maxSentenceWords || 26,
          targetReadingGrade: guidelines.writingGuidelines?.targetReadingGrade || '8th to 10th Grade (Clear & Accessible)',
          emojiSocial: guidelines.writingGuidelines?.emojiRules?.social || 'Maximum 2 relevant emojis',
          emojiFormal: guidelines.writingGuidelines?.emojiRules?.formal || 'Strictly 0 emojis in formal documentation',
          punctuation: guidelines.writingGuidelines?.punctuation || 'Serial (Oxford) comma is mandatory'
        });
      } else {
        setFormData({ ...item });
      }
      setIsAddModalOpen(true);
    };

    // Tone rules handlers
    const handleAddToneRule = () => {
      if (!newToneRule.trim()) return;
      const updated = { ...guidelines };
      if (!updated.tone) updated.tone = {};
      if (!updated.tone.rules) updated.tone.rules = [];
      updated.tone.rules = [...updated.tone.rules, newToneRule.trim()];
      onSaveGuidelines(updated);
      setNewToneRule('');
      if (showToast) showToast('Added brand voice rule.', 'success');
    };

    const handleDeleteToneRule = (index) => {
      const updated = { ...guidelines };
      if (!updated.tone || !updated.tone.rules) return;
      updated.tone.rules = updated.tone.rules.filter((_, i) => i !== index);
      onSaveGuidelines(updated);
      if (showToast) showToast('Removed voice rule.', 'info');
    };

    // Save modal item (add or edit)
    const handleSaveModalItem = (e) => {
      e.preventDefault();
      const updated = { ...guidelines };

      if (modalType === 'terminology') {
        if (!formData.deprecated || !formData.approved) {
          if (showToast) showToast('Please fill in required fields.', 'warning');
          return;
        }
        if (editingItem) {
          updated.terminology = updated.terminology.map(t => t.id === editingItem.id ? { ...t, ...formData } : t);
        } else {
          updated.terminology = [{ id: `term-${Date.now()}`, ...formData }, ...(updated.terminology || [])];
        }
      } else if (modalType === 'banned') {
        if (!formData.term || !formData.reason) {
          if (showToast) showToast('Please fill in required fields.', 'warning');
          return;
        }
        const parsedAlts = typeof formData.alternatives === 'string'
          ? formData.alternatives.split(',').map(s => s.trim()).filter(Boolean)
          : formData.alternatives;

        const newItem = { ...formData, alternatives: parsedAlts };
        if (editingItem) {
          updated.prohibitedWords = updated.prohibitedWords.map(b => b.id === editingItem.id ? { ...b, ...newItem } : b);
        } else {
          updated.prohibitedWords = [{ id: `banned-${Date.now()}`, ...newItem }, ...(updated.prohibitedWords || [])];
        }
      } else if (modalType === 'facts') {
        if (!formData.key || !formData.fact) {
          if (showToast) showToast('Please fill in required fields.', 'warning');
          return;
        }
        if (editingItem) {
          updated.facts = updated.facts.map(f => f.id === editingItem.id ? { ...f, ...formData } : f);
        } else {
          updated.facts = [{ id: `fact-${Date.now()}`, ...formData }, ...(updated.facts || [])];
        }
      } else if (modalType === 'claims') {
        if (!formData.title || !formData.claimText) {
          if (showToast) showToast('Please fill in required fields.', 'warning');
          return;
        }
        if (editingItem) {
          updated.claims = updated.claims.map(c => c.id === editingItem.id ? { ...c, ...formData } : c);
        } else {
          updated.claims = [{ id: `claim-${Date.now()}`, ...formData }, ...(updated.claims || [])];
        }
      } else if (modalType === 'writing') {
        updated.writingGuidelines = {
          ...updated.writingGuidelines,
          maxSentenceWords: parseInt(formData.maxSentenceWords, 10) || 26,
          targetReadingGrade: formData.targetReadingGrade || '8th to 10th Grade',
          emojiRules: {
            social: formData.emojiSocial || 'Maximum 2 relevant emojis',
            email: guidelines.writingGuidelines?.emojiRules?.email || 'Maximum 1 subtle emoji in body, none in subject',
            formal: formData.emojiFormal || 'Strictly 0 emojis in formal documentation'
          },
          punctuation: formData.punctuation || 'Serial (Oxford) comma is mandatory'
        };
      }

      onSaveGuidelines(updated);
      setIsAddModalOpen(false);
      if (showToast) showToast(editingItem ? 'Guideline updated.' : 'Guideline saved.', 'success');
    };

    // Update tone slider
    const handleSliderChange = (sliderKey, val) => {
      const updated = { ...guidelines };
      if (!updated.tone) updated.tone = {};
      if (!updated.tone.sliders) updated.tone.sliders = {};
      updated.tone.sliders[sliderKey] = parseInt(val, 10);
      onSaveGuidelines(updated);
    };

    // Export Guidelines JSON
    const handleExportJSON = () => {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(guidelines, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute('href', dataStr);
      downloadAnchor.setAttribute('download', `brandguard-guidelines-${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      if (showToast) showToast('Brand guidelines exported as JSON.', 'success');
    };

    // Import Guidelines JSON
    const handleImportJSON = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed && (parsed.prohibitedWords || parsed.terminology || parsed.facts)) {
            onSaveGuidelines(parsed);
            if (showToast) showToast('Imported brand guidelines successfully!', 'success');
          } else {
            if (showToast) showToast('Invalid guidelines file schema.', 'error');
          }
        } catch (err) {
          if (showToast) showToast('Failed to parse JSON file.', 'error');
        }
      };
      reader.readAsText(file);
    };

    return (
      <div className="space-y-6 animate-fadeIn">
        {/* Header & Export/Import Controls */}
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-lg">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <h2 className="text-xl sm:text-2xl font-extrabold text-white">Brand Governance Guidelines</h2>
              <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                v{guidelines.version || '2.4.0'}
              </span>
            </div>
            <p className="text-xs text-slate-400">
              Configure corporate tone, prohibited vocabulary, official facts, and certified marketing claims.
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            {/* Import JSON */}
            <label className="cursor-pointer px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors flex items-center gap-1.5">
              <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
              </svg>
              <span>Import JSON</span>
              <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
            </label>

            {/* Export JSON */}
            <button
              type="button"
              onClick={handleExportJSON}
              className="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors flex items-center gap-1.5"
            >
              <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              <span>Export JSON</span>
            </button>

            {/* Reset to Defaults */}
            <button
              type="button"
              onClick={() => {
                if (window.confirm('Reset all brand guidelines back to default enterprise baseline?')) {
                  onResetGuidelines();
                  if (showToast) showToast('Reset guidelines to default baseline.', 'info');
                }
              }}
              className="px-3 py-2 rounded-xl text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-colors"
            >
              Reset Defaults
            </button>
          </div>
        </div>

        {/* Pillar Tabs Navigation */}
        <div className="flex items-center gap-2 border-b border-slate-800 pb-2 overflow-x-auto">
          {[
            { id: 'terminology', label: 'Approved Terminology', count: guidelines.terminology?.length || 0 },
            { id: 'banned', label: 'Prohibited Buzzwords', count: guidelines.prohibitedWords?.length || 0 },
            { id: 'facts', label: 'Brand Facts Repository', count: guidelines.facts?.length || 0 },
            { id: 'claims', label: 'Marketing Claims', count: guidelines.claims?.length || 0 },
            { id: 'tone', label: 'Brand Tone & Sliders' },
            { id: 'writing', label: 'Writing Guidelines' }
          ].map(tab => (
            <button
              key={tab.id}
              type="button"
              onClick={() => { setActiveSection(tab.id); setSearchQuery(''); }}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                activeSection === tab.id
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
              }`}
            >
              <span>{tab.label}</span>
              {tab.count !== undefined && (
                <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${

                }`}>
                  {tab.count}
                </span>
              )}
            </button>
          ))}
        </div>

        {/* Search & Add Bar */}
        {(activeSection === 'terminology' || activeSection === 'banned' || activeSection === 'facts' || activeSection === 'claims') && (
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

              </svg>
              <input

                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder={`Search ${activeSection}...`}
                className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              />

            <button
              type="button"
              onClick={() => openAddModal(activeSection)}
              className="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition-all self-start sm:self-auto"
            >
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />

              <span>Add Entry</span>
            </button>
          </div>

        {/* Tab 1: Approved Terminology */}
        {activeSection === 'terminology' && (
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">

// BrandGuard AI - Review Workflow & Governance Queue Component
(function(window) {
  'use strict';

  const ReviewWorkflowView = ({
    history = [],
    activeRole = 'reviewer',
    settings = {},
    onUpdateRecord,
    onOpenInChecker,
    showToast
  }) => {
    const [statusFilter, setStatusFilter] = React.useState('pending_approval');
    const [selectedRecord, setSelectedRecord] = React.useState(null);
    const [modalAction, setModalAction] = React.useState(null); // 'approve' | 'reject'
    const [reviewComment, setReviewComment] = React.useState('');

    // Filter history records
    const filteredQueue = React.useMemo(() => {
      if (statusFilter === 'all') return history;
      return history.filter(h => h.status === statusFilter);
    }, [history, statusFilter]);

    const counts = {
      all: history.length,
      pending: history.filter(h => h.status === 'pending_approval').length,
      approved: history.filter(h => h.status === 'approved').length,
      revision: history.filter(h => h.status === 'needs_revision').length,
      draft: history.filter(h => h.status === 'draft').length
    };

    const handleOpenReviewModal = (record, action) => {
      setSelectedRecord(record);
      setModalAction(action);
      setReviewComment(action === 'approve' ? 'Content verified against brand guidelines and approved for publication.' : '');
    };

    const handleConfirmReview = () => {
      if (!selectedRecord || !modalAction) return;

      const isApprove = modalAction === 'approve';
      const updatedStatus = isApprove ? 'approved' : 'needs_revision';

      const updatedRecord = {
        ...selectedRecord,
        status: updatedStatus,
        reviewer: settings.reviewerName || 'Jane Doe (Head of Brand & Legal)',
        reviewedAt: new Date().toISOString(),
        reviewNote: reviewComment,
        auditLog: [
          ...(selectedRecord.auditLog || []),
          {
            timestamp: new Date().toISOString(),
            actor: settings.reviewerName || 'Jane Doe',
            action: isApprove ? 'Approved Content for Publication' : 'Requested Revisions',
            note: reviewComment
          }
        ]
      };

      onUpdateRecord(updatedRecord);
      setSelectedRecord(null);
      setModalAction(null);

      if (showToast) {
        showToast(
          isApprove ? `Approved "${selectedRecord.title}"!` : `Requested changes on "${selectedRecord.title}".`,
          isApprove ? 'success' : 'warning'
        );
      }
    };

    return (
      <div className="space-y-6 animate-fadeIn">
        {/* Header Banner */}
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-lg">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <h2 className="text-xl sm:text-2xl font-extrabold text-white">Editorial Review Queue</h2>
              <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 font-semibold">
                Governance Gate
              </span>
            </div>
            <p className="text-xs text-slate-400">
              Ensure all public-facing collateral receives compliance sign-off before distribution.
            </p>
          </div>

          <div className="flex items-center gap-3">
            <div className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs">
              <span className="text-slate-400">Current Role: </span>
              <strong className="text-indigo-400 font-bold capitalize">
                {activeRole === 'reviewer' ? 'Compliance Reviewer' : 'Draft Author'}
              </strong>
            </div>
          </div>

})(window);

// BrandGuard AI - History & Library Component
(function(window) {
  'use strict';

  const HistoryView = ({
    history = [],
    onOpenInChecker,
    onDeleteRecord,
    onClearAll,
    showToast
  }) => {
    const [searchQuery, setSearchQuery] = React.useState('');
    const [statusFilter, setStatusFilter] = React.useState('all');
    const [typeFilter, setTypeFilter] = React.useState('all');
    const [selectedReport, setSelectedReport] = React.useState(null); // for report modal

    // Filter history
    const filteredHistory = React.useMemo(() => {
      return history.filter(item => {
        if (statusFilter !== 'all' && item.status !== statusFilter) return false;
        if (typeFilter !== 'all' && item.contentType !== typeFilter) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchesTitle = (item.title || '').toLowerCase().includes(q);
          const matchesContent = (item.content || '').toLowerCase().includes(q);
          if (!matchesTitle && !matchesContent) return false;
        }
        return true;
      });
    }, [history, statusFilter, typeFilter, searchQuery]);

    // Export report as Markdown file
    const handleDownloadReport = (record) => {
      const markdown = `# BrandGuard AI Governance Compliance Report
**Document Title:** ${record.title}
**Date Analyzed:** ${new Date(record.updatedAt || record.createdAt).toLocaleString()}
**Content Type:** ${record.contentType.toUpperCase()}
**Governance Compliance Score:** ${record.brandScore}/100 (${record.scoreTier})
**Review Status:** ${record.status.toUpperCase()}
**Compliance Reviewer:** ${record.reviewer || 'Pending Assignment'}

---

## Content Analyzed
\`\`\`text
${record.content}
\`\`\`

---

## Governance Summary
- **Total Flagged Issues:** ${record.issuesCount || 0}
- **Resolved / Corrected Issues:** ${record.resolvedIssuesCount || 0}
- **Reviewer Sign-off Notes:** ${record.reviewNote || 'None recorded'}

---

## Legal & Audit Disclaimer
*This report represents an internal corporate governance assessment generated by BrandGuard AI. It does not constitute statutory warranty or legal certification.*
`;

      const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `brandguard-report-${record.id}.md`);
      document.body.appendChild(link);
      link.click();
      link.remove();

      if (showToast) showToast('Compliance report downloaded as Markdown.', 'success');
    };

    return (
      <div className="space-y-6 animate-fadeIn">
        {/* Header */}
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-lg">
          <div>
            <h2 className="text-xl sm:text-2xl font-extrabold text-white mb-1">Content Governance Archive</h2>
